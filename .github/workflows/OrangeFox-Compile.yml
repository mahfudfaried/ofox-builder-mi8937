name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - '12.1'
        - '11.0'
      DEVICE_TREE:
        description: 'OrangeFox / TWRP Device Tree'
        required: true
        default: 'https://github.com/TeamWin/android_device_xiaomi_mi8937.git'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/xiaomi/mi8937'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'mi8937'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - recovery
        - boot
        - vendorboot
      ENABLE_WIFI:
        description: 'Aktifkan Dukungan WiFi (TW_INCLUDE_WIFI)'
        required: true
        default: true
        type: boolean
      ENABLE_APP_MANAGER:
        description: 'Aktifkan Fitur App Manager (OF_DISABLE_EXTRA_EXTRACTING=0)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build OrangeFox (${{ inputs.DEVICE_NAME }})
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Setup Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Setup Android Build Environment
      run: |
        sudo apt update && sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master scripts
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Sync OrangeFox Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master sync
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree & Dependencies (RDP & FBE)
      run: |
        FOX_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
        cd "$FOX_DIR"
        rm -rf ./${{ inputs.DEVICE_PATH }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

        cd "$FOX_DIR"
        # Clone common and kernel dependencies jika target mi8937 / mithorium
        if [ ! -d "device/xiaomi/mithorium-common" ]; then
          echo "Cloning device/xiaomi/mithorium-common (android-12.1)..."
          git clone https://github.com/TeamWin/android_device_xiaomi_mithorium-common.git -b android-12.1 device/xiaomi/mithorium-common
        fi
        if [ ! -d "device/xiaomi/kernel-mithorium" ]; then
          echo "Cloning device/xiaomi/kernel-mithorium (master)..."
          git clone --depth 1 https://github.com/TeamWin/android_device_xiaomi_kernel-mithorium.git -b master device/xiaomi/kernel-mithorium
        fi

    - name: Adapt Device Tree for OrangeFox 12.1 & RDP Decryption Fix
      run: |
        FOX_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}"
        DEV_DIR="$FOX_DIR/${{ inputs.DEVICE_PATH }}"
        COMMON_DIR="$FOX_DIR/device/xiaomi/mithorium-common"
        cd "$DEV_DIR"

        echo "Menyesuaikan makefile untuk OrangeFox, RDP, dan perbaikan dekripsi modern FBE..."

        # 1. Konversi omni_<device>.mk ke twrp_<device>.mk jika ada legacy tree
        if [ -f "omni_${{ inputs.DEVICE_NAME }}.mk" ]; then
          sed -e 's|vendor/omni/config/common.mk|vendor/twrp/config/common.mk|g' \
              -e 's|.*vendor/omni/config/gsm.mk.*||g' \
              -e "s|PRODUCT_NAME := omni_${{ inputs.DEVICE_NAME }}|PRODUCT_NAME := twrp_${{ inputs.DEVICE_NAME }}|g" \
              "omni_${{ inputs.DEVICE_NAME }}.mk" > "twrp_${{ inputs.DEVICE_NAME }}.mk"
        fi

        # 2. Hapus referensi file usang jika ada
        find . -name "*.mk" -exec sed -i 's|.*languages_full.mk.*||g' {} +
        find . -name "*.mk" -exec sed -i 's|.*recovery/kernel:kernel.*||g' {} +

        # 3. Tangani arsitektur 64-bit CPU dengan 32-bit userspace apps
        if ! grep -q "TARGET_SUPPORTS_64_BIT_APPS" BoardConfig.mk; then
          echo "" >> BoardConfig.mk
          echo "# Fix AOSP 12 32-bit app check on 64-bit device" >> BoardConfig.mk
          echo "TARGET_SUPPORTS_64_BIT_APPS := false" >> BoardConfig.mk
        fi

        # 4. Pastikan AndroidProducts.mk dan COMMON_LUNCH_CHOICES terdefinisi
        if [ ! -f "AndroidProducts.mk" ]; then
          echo "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/twrp_${{ inputs.DEVICE_NAME }}.mk" > AndroidProducts.mk
          echo "" >> AndroidProducts.mk
          echo "COMMON_LUNCH_CHOICES := \\" >> AndroidProducts.mk
          echo "    twrp_${{ inputs.DEVICE_NAME }}-eng \\" >> AndroidProducts.mk
          echo "    twrp_${{ inputs.DEVICE_NAME }}-userdebug" >> AndroidProducts.mk
        fi

        # 5. Perbaiki format CUSTOM_LUN_FILE format string jika ada
        sed -i 's|lun0/file|lun%d/file|g' BoardConfig.mk || true

        # 6. Aktifkan tombol navigasi fisik/kapasitif (Back, Home, Menu)
        if ! grep -q "TW_HAS_CAPACITIVE_KEYS" BoardConfig.mk; then
          echo "" >> BoardConfig.mk
          echo "# Enable physical/capacitive hardware navigation keys" >> BoardConfig.mk
          echo "TW_HAS_CAPACITIVE_KEYS := true" >> BoardConfig.mk
        fi

        # 7. Salin foto profil maintainer ke device tree
        if [ -f "${GITHUB_WORKSPACE}/assets/maintainer.png" ]; then
          cp "${GITHUB_WORKSPACE}/assets/maintainer.png" "$DEV_DIR/maintainer.png"
          echo "Avatar maintainer berhasil disalin ke device tree."
        fi

        # 8. Konfigurasi FBE v2 policy & Metadata Decryption untuk Android 11-17 (LineageOS modern)
        if [ -d "$COMMON_DIR" ]; then
          sed -i 's|TW_USE_FSCRYPT_POLICY := 1|TW_USE_FSCRYPT_POLICY := 2|g' "$COMMON_DIR/BoardConfigCommon.mk" || true
        fi
        if ! grep -q "TW_INCLUDE_FBE_METADATA_DECRYPT" BoardConfig.mk; then
          echo "" >> BoardConfig.mk
          echo "# Modern FBE Decryption Policy" >> BoardConfig.mk
          echo "TW_INCLUDE_FBE_METADATA_DECRYPT := true" >> BoardConfig.mk
          echo "TW_USE_FSCRYPT_POLICY := 2" >> BoardConfig.mk
        fi

        # 9. Pindahkan eksekusi merge-fstab.sh dari 'on init' ke 'on fs' (setelah /dev/block/bootdevice dibuat)
        if [ -f "recovery/root/init.recovery.device.rc" ]; then
          sed -i '/exec u:r:recovery:s0 -- \/system\/bin\/merge-fstab.sh/d' recovery/root/init.recovery.device.rc
        fi
        if [ -f "$COMMON_DIR/recovery/root/init.recovery.qcom.rc" ]; then
          if ! grep -q "merge-fstab.sh" "$COMMON_DIR/recovery/root/init.recovery.qcom.rc"; then
            sed -i '/symlink \/dev\/block\/platform\/soc/a\    exec u:r:recovery:s0 -- /system/bin/merge-fstab.sh' "$COMMON_DIR/recovery/root/init.recovery.qcom.rc"
          fi
          # Pastikan gatekeeper service distart bersamaan dengan keymaster & qseecomd
          if ! grep -q "gatekeeper-1-0" "$COMMON_DIR/recovery/root/init.recovery.qcom.rc"; then
            sed -i '/start keymaster-4-0-qti/a\    start gatekeeper-1-0\n    start gatekeeper-1-0-qti' "$COMMON_DIR/recovery/root/init.recovery.qcom.rc"
          fi
        fi

        # 10. Patch merge-fstab.sh untuk mendukung dekripsi modern FBE (Retrofit Dynamic Partitions)
        if [ -f "recovery/root/system/bin/merge-fstab.sh" ]; then
          echo "Menerapkan fallback FBE otomatis pada recovery/root/system/bin/merge-fstab.sh..."
          sed -i '/umount \/data || true/!b;n;c\else\n    sed -i '\''s|,encryptable=footer|,fileencryption=aes-256-xts|g'\'' /system/etc/recovery.fstab\n    sed -i '\''s|encryptable=footer;|fileencryption=aes-256-xts;|g'\'' /system/etc/twrp.flags\nfi' recovery/root/system/bin/merge-fstab.sh
        fi

        echo "Pembaruan tree selesai."

    - name: Compile OrangeFox Recovery
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

        # Toleransi peringatan compiler format string jika ada
        if [ -f "bootable/recovery/Android.mk" ]; then
          sed -i 's|-Wall -Werror|-Wall -Werror -Wno-error=format-extra-args|g' bootable/recovery/Android.mk
        fi

        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true

        # Identitas maintainer resmi di layar About OrangeFox
        export OF_MAINTAINER="mahfudfaried"

        # Avatar maintainer resmi
        if [ -f "${GITHUB_WORKSPACE}/assets/maintainer.png" ]; then
          export OF_MAINTAINER_AVATAR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/${{ inputs.DEVICE_PATH }}/maintainer.png"
        fi

        # Dukungan tombol fisik dan opsi menyembunyikan on-screen navbar
        export OF_ALLOW_DISABLE_NAVBAR=1

        # Konfigurasi fitur App Manager
        if [ "${{ inputs.ENABLE_APP_MANAGER }}" = "true" ]; then
          export FOX_ENABLE_APP_MANAGER=1
          export OF_DISABLE_EXTRA_EXTRACTING=0
          echo "Fitur App Manager & Addons: DIAKTIFKAN"
        fi

        # Pengaturan kompresi dan biner tambahan
        export OF_USE_HEX_COMPRESSION=1
        export FOX_REPLACE_TOOLBOX_GETPROP=1
        export OF_USE_MAGISKBOOT=1
        export OF_USE_NEW_MAGISKBOOT=1

        set -e
        # Melakukan lunch target twrp
        lunch twrp_${{ inputs.DEVICE_NAME }}-eng

        make clean
        mka adbd ${{ inputs.BUILD_TARGET }}image

    - name: Set Release Info
      run: |
        echo "BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
        echo "BUILD_TAG=ofox-${{ inputs.DEVICE_NAME }}-$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

    - name: Upload Recovery ke GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
        name: OrangeFox Recovery untuk ${{ inputs.DEVICE_NAME }} (${{ inputs.MANIFEST_BRANCH }})
        tag_name: ${{ env.BUILD_TAG }}
        body: |
          ## 🦊 OrangeFox Recovery Build (${{ inputs.DEVICE_NAME }})

          * **Maintainer:** `mahfudfaried`
          * **Manifest Branch:** `fox_${{ inputs.MANIFEST_BRANCH }}`
          * **Target Perangkat:** `${{ inputs.DEVICE_NAME }}` (Xiaomi Redmi 4X / mi8937)
          * **Partition Scheme:** Retrofit Dynamic Partitions (RDP)
          * **Encryption:** File-Based Encryption (FBE v2) & FDE Compatible
          * **Device Tree:** [${{ inputs.DEVICE_TREE }}](${{ inputs.DEVICE_TREE }}) (Branch: `${{ inputs.DEVICE_TREE_BRANCH }}`)
          * **WiFi Enabled:** `${{ inputs.ENABLE_WIFI }}`
          * **App Manager Enabled:** `${{ inputs.ENABLE_APP_MANAGER }}`
          * **Waktu Build:** `${{ env.BUILD_DATE }}`
