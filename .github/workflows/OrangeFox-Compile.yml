name: OrangeFox - Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '12.1'
        type: choice
        options:
        - '12.1'
        - '11.0'
      DEVICE_TREE:
        description: 'OrangeFox / TWRP Device Tree'
        required: true
        default: 'https://github.com/Dhruvgera/santoni-ofrp.git'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'android-9.0'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/xiaomi/santoni'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'santoni'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recovery'
        type: choice
        options:
        - recovery
        - boot
        - vendorboot
      ENABLE_WIFI:
        description: 'Aktifkan Dukungan WiFi (TW_INCLUDE_WIFI)'
        required: true
        default: true
        type: boolean
      ENABLE_APP_MANAGER:
        description: 'Aktifkan Fitur App Manager (OF_DISABLE_EXTRA_EXTRACTING=0)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build OrangeFox (${{ inputs.DEVICE_NAME }})
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Free Disk Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Setup Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 24

    - name: Setup Android Build Environment
      run: |
        sudo apt update && sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts.git -b master scripts
        cd scripts
        sudo bash setup/android_build_env.sh

    - name: Sync OrangeFox Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
        git clone https://gitlab.com/OrangeFox/sync.git -b master sync
        cd sync
        ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        rm -rf ./${{ inputs.DEVICE_PATH }}
        git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
        cd ${{ inputs.DEVICE_PATH }}
        echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Setup cryptfs_hw Soong Module
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        rm -rf device/qcom/common vendor/qcom/opensource/commonsys/cryptfs_hw temp_qcom
        git clone https://github.com/minimal-manifest-twrp/platform_device_qcom_common.git temp_qcom
        mkdir -p vendor/qcom/opensource/commonsys/cryptfs_hw
        cp temp_qcom/cryptfs_hw/cryptfs_hw.c vendor/qcom/opensource/commonsys/cryptfs_hw/
        cp temp_qcom/cryptfs_hw/cryptfs_hw.h vendor/qcom/opensource/commonsys/cryptfs_hw/
        rm -rf temp_qcom

        # Sesuaikan include path di cryptfs_hw.c untuk Android 12
        sed -i 's|"keymaster_common.h"|<hardware/keymaster_common.h>|g' vendor/qcom/opensource/commonsys/cryptfs_hw/cryptfs_hw.c
        sed -i 's|"hardware.h"|<hardware/hardware.h>|g' vendor/qcom/opensource/commonsys/cryptfs_hw/cryptfs_hw.c

        # Buat Android.bp modern agar dikenali oleh Soong (system/vold)
        cat << 'EOF' > vendor/qcom/opensource/commonsys/cryptfs_hw/Android.bp
        cc_library_headers {
            name: "libcryptfs_hw_headers",
            export_include_dirs: ["."],
            vendor_available: true,
            recovery_available: true,
            host_supported: true,
        }

        cc_library {
            name: "libcryptfs_hw",
            srcs: ["cryptfs_hw.c"],
            include_dirs: [
                "hardware/libhardware/include",
                "hardware/libhardware/include/hardware",
            ],
            header_libs: [
                "libcryptfs_hw_headers",
                "libhardware_headers",
            ],
            shared_libs: [
                "libcutils",
                "libutils",
                "liblog",
                "libhardware",
            ],
            cflags: [
                "-Wno-error",
                "-Wno-unused-parameter",
                "-Wno-sign-compare",
            ],
            vendor_available: true,
            recovery_available: true,
        }
        EOF

    - name: Adapt Device Tree for OrangeFox 12.1
      run: |
        DEV_DIR="${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/${{ inputs.DEVICE_PATH }}"
        cd "$DEV_DIR"

        echo "Menyesuaikan makefile untuk sistem build AOSP 12.1..."

        # 1. Konversi omni_<device>.mk ke twrp_<device>.mk
        if [ -f "omni_${{ inputs.DEVICE_NAME }}.mk" ]; then
          sed -e 's|vendor/omni/config/common.mk|vendor/twrp/config/common.mk|g' \
              -e 's|.*vendor/omni/config/gsm.mk.*||g' \
              -e "s|PRODUCT_NAME := omni_${{ inputs.DEVICE_NAME }}|PRODUCT_NAME := twrp_${{ inputs.DEVICE_NAME }}|g" \
              "omni_${{ inputs.DEVICE_NAME }}.mk" > "twrp_${{ inputs.DEVICE_NAME }}.mk"
        fi

        # 2. Hapus referensi file yang sudah usang di Android 12 (seperti languages_full.mk jika ada)
        find . -name "*.mk" -exec sed -i 's|.*languages_full.mk.*||g' {} +

        # 3. Hapus duplikasi penyalinan kernel di PRODUCT_COPY_FILES karena sudah diatur oleh TARGET_PREBUILT_KERNEL
        find . -name "*.mk" -exec sed -i 's|.*recovery/kernel:kernel.*||g' {} +

        # 4. Tangani arsitektur 64-bit CPU dengan 32-bit userspace apps
        if ! grep -q "TARGET_SUPPORTS_64_BIT_APPS" BoardConfig.mk; then
          echo "" >> BoardConfig.mk
          echo "# Fix AOSP 12 32-bit app check on 64-bit device" >> BoardConfig.mk
          echo "TARGET_SUPPORTS_64_BIT_APPS := false" >> BoardConfig.mk
        fi

        # 5. Pastikan TARGET_CRYPTFS_HW_PATH mengarah ke folder cryptfs_hw yang valid
        sed -i 's|TARGET_CRYPTFS_HW_PATH :=.*|TARGET_CRYPTFS_HW_PATH := vendor/qcom/opensource/commonsys/cryptfs_hw|g' BoardConfig.mk

        # 6. Perbarui AndroidProducts.mk dan COMMON_LUNCH_CHOICES standar Android 12.1
        echo "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/twrp_${{ inputs.DEVICE_NAME }}.mk" > AndroidProducts.mk
        echo "" >> AndroidProducts.mk
        echo "COMMON_LUNCH_CHOICES := \\" >> AndroidProducts.mk
        echo "    twrp_${{ inputs.DEVICE_NAME }}-eng \\" >> AndroidProducts.mk
        echo "    twrp_${{ inputs.DEVICE_NAME }}-userdebug" >> AndroidProducts.mk

        # 7. Kosongkan vendorsetup.sh agar tidak terjadi pesan usang add_lunch_combo
        if [ -f "vendorsetup.sh" ]; then
          > vendorsetup.sh
        fi

        echo "Pembaruan tree selesai."

    - name: Compile OrangeFox Recovery
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true

        # Nama maintainer resmi di layar About OrangeFox
        export OF_MAINTAINER="mahfudfaried"

        # Konfigurasi fitur WiFi & App Manager
        if [ "${{ inputs.ENABLE_WIFI }}" = "true" ]; then
          export TW_INCLUDE_WIFI=true
          echo "Dukungan WiFi: DIAKTIFKAN"
        fi

        if [ "${{ inputs.ENABLE_APP_MANAGER }}" = "true" ]; then
          export OF_DISABLE_EXTRA_EXTRACTING=0
          echo "Fitur App Manager & Addons: DIAKTIFKAN"
        fi

        # Pengaturan kompresi dan biner tambahan
        export OF_USE_HEX_COMPRESSION=1
        export FOX_REPLACE_TOOLBOX_GETPROP=1
        export OF_USE_MAGISKBOOT=1
        export OF_USE_NEW_MAGISKBOOT=1

        set -e
        # Melakukan lunch twrp target
        lunch twrp_${{ inputs.DEVICE_NAME }}-eng

        make clean
        mka adbd ${{ inputs.BUILD_TARGET }}image

    - name: Set Release Info
      run: |
        echo "BUILD_DATE=$(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
        echo "BUILD_TAG=ofox-${{ inputs.DEVICE_NAME }}-$(date +'%Y%m%d-%H%M')" >> $GITHUB_ENV

    - name: Upload Recovery ke GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}/OrangeFox*.zip
        name: OrangeFox Recovery untuk ${{ inputs.DEVICE_NAME }} (${{ inputs.MANIFEST_BRANCH }})
        tag_name: ${{ env.BUILD_TAG }}
        body: |
          ## 🦊 OrangeFox Recovery Build (${{ inputs.DEVICE_NAME }})

          * **Maintainer:** `mahfudfaried`
          * **Manifest Branch:** `fox_${{ inputs.MANIFEST_BRANCH }}`
          * **Target Perangkat:** `${{ inputs.DEVICE_NAME }}`
          * **Device Tree:** [${{ inputs.DEVICE_TREE }}](${{ inputs.DEVICE_TREE }}) (Branch: `${{ inputs.DEVICE_TREE_BRANCH }}`)
          * **WiFi Enabled:** `${{ inputs.ENABLE_WIFI }}`
          * **App Manager Enabled:** `${{ inputs.ENABLE_APP_MANAGER }}`
          * **Waktu Build:** `${{ env.BUILD_DATE }}`
